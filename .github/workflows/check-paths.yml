name: Check path portability

# Guards against tracked files whose names break `git clone`/checkout on
# Windows/NTFS (illegal characters: < > : " | ? *). See issue #24.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject Windows-illegal path characters
        run: |
          bad=$(git ls-files | grep -E '[<>:"|?*]' || true)
          if [ -n "$bad" ]; then
            echo "::error::Tracked paths contain Windows-illegal characters (these break git checkout on Windows/NTFS):"
            echo "$bad"
            exit 1
          fi
          echo "All tracked paths are Windows-safe."

      - name: Reject private note paths in research data
        # Research output once published the file names of the author's private
        # knowledge store (2026-10-09). Data files under research/ must not name notes.
        run: |
          bad=$(git grep -l -E '(ops|profile|projects|feedback|craft|topics|private)/[a-z0-9-]+\.md' -- 'research/*.json' 'research/*.jsonl' || true)
          if [ -n "$bad" ]; then
            echo "::error::Research data names private knowledge-store notes. Replace each path with an opaque id:"
            echo "$bad"
            exit 1
          fi
          echo "No private note paths in research data."
