name: Installer tests

# Deterministic CI for install.sh / install.ps1 plus the files-only store
# invariants (tests/files-only). The install-behavior job
# depends on tests that install from the local checkout (AURA_DISTILL_REPO
# override) into throwaway temp homes — no network, no real profile dirs.
# It is guarded by file existence so this workflow is safe to merge before
# the test suite lands (PR #42) and activates automatically once it does.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  syntax:
    name: Syntax checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n install.sh
        run: bash -n install.sh

      - name: bash -n bin/distill-update.sh
        run: if [ -f bin/distill-update.sh ]; then bash -n bin/distill-update.sh; fi

      - name: Legacy endpoint guard (docs/adr/0001, 0002)
        # Stable surface when the change targets main (a PR into main, or a push
        # to main); beta surface otherwise (prerelease VERSION values allowed).
        run: |
          if [ -f tests/updater-compat/check-endpoints.sh ]; then
            target="${GITHUB_BASE_REF:-$GITHUB_REF_NAME}"
            surface=beta; [ "$target" = main ] && surface=stable
            bash tests/updater-compat/check-endpoints.sh --surface "$surface"
          fi

      - name: PowerShell parser on install.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'install.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) {
            $errors | ForEach-Object { Write-Host "::error::$($_.Message)" }
            exit 1
          }
          Write-Host 'install.ps1 parses cleanly.'

  install-behavior:
    name: Deterministic installer tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: PowerShell installer suite
        shell: pwsh
        run: |
          if (Test-Path tests/test-codex.ps1) {
            pwsh -NoProfile -File tests/test-codex.ps1
          } else {
            Write-Host 'tests/test-codex.ps1 not on this branch yet; skipping.'
          }

      - name: Bash installer suite
        if: runner.os == 'Linux'
        run: |
          if [ -f tests/test-install.sh ]; then
            bash tests/test-install.sh
          else
            echo "tests/test-install.sh not on this branch yet; skipping."
          fi

      - name: Legacy updater compatibility reproductions (docs/adr/0001)
        if: runner.os == 'Linux'
        run: |
          if [ -f tests/updater-compat/run.sh ]; then
            bash tests/updater-compat/run.sh
          else
            echo "tests/updater-compat/run.sh not on this branch yet; skipping."
          fi

      - name: Clean reviewer runner (stubbed, no API calls)
        if: runner.os == 'Linux'
        run: |
          if [ -f tests/review/test-run-clean-review.sh ]; then
            bash tests/review/test-run-clean-review.sh
          else
            echo "tests/review not on this branch; skipping."
          fi

  files-only-store:
    # Files-only memory redesign invariants (#75): synthetic store fixture, no
    # network, no profile dirs. Runs on GNU and BSD toolchains on purpose.
    name: Files-only store checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Files-only suite
        run: |
          if [ -f tests/files-only/run-files-only-tests.sh ]; then
            bash tests/files-only/run-files-only-tests.sh
          else
            echo "tests/files-only not on this branch; skipping."
          fi
